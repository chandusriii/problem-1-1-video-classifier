setup_commands:
  - "python -m pip install -r requirements.txt"

run_commands:
  - "python src/main.py --help"
  - "python -m unittest discover -s tests -v"
  - "python src/main.py --limit 1"

test_commands:
  - "python -m unittest discover -s tests -v"

notes: "This CPU-first baseline validates question metadata, local video availability, and deterministic frame-sampling utilities. It does not claim model inference or benchmark accuracy."
