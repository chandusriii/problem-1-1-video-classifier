setup_commands:
  - "python -m pip install -r requirements.txt"

run_commands:
  - "python src/main.py --help"
  - "python -m unittest discover -s tests -v"
  - "python -c \"import json, pathlib, urllib.request; qa=pathlib.Path('data/qa/test.jsonl'); qa.parent.mkdir(parents=True, exist_ok=True); url='https://huggingface.co/datasets/aintropy-ai/video-mme-sample10/resolve/main/qa/test.jsonl'; urllib.request.urlretrieve(url, str(qa)) if not qa.exists() else None; rows=[json.loads(line) for line in qa.read_text(encoding='utf-8-sig').splitlines() if line.strip()]; video_id=str(rows[0]['video_id']); out=pathlib.Path('data/videos'); out.mkdir(parents=True, exist_ok=True); video=out/(video_id+'.mp4'); urllib.request.urlretrieve('https://huggingface.co/datasets/aintropy-ai/video-mme-sample10/resolve/main/videos/'+video_id+'.mp4', str(video)) if not video.exists() else None; print('Question metadata and first video prepared:', video_id)\""
  - "python src/infer.py --qa data/qa/test.jsonl --video-dir data/videos --limit 1 --frames 4"

test_commands: []

notes: "Quality-first smoke test: tests are executed once in run_commands. The run downloads only the question metadata and the first MP4, then runs one model inference. SmolVLM2 weights download on first use; inference may take multiple minutes on CPU. One-question accuracy is not a benchmark estimate."
