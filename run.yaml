setup_commands:
  - "python -m pip install -r requirements.txt"

run_commands:
  - "python src/main.py --help"
  - "python -m unittest discover -s tests -v"
  - "python -c \"from huggingface_hub import hf_hub_download; import pathlib; pathlib.Path('data/qa').mkdir(parents=True, exist_ok=True); p=hf_hub_download(repo_id='aintropy-ai/video-mme-sample10', filename='qa/test.jsonl', repo_type='dataset', local_dir='.'); print('QA metadata:', p)\""
  - "python src/infer.py --qa data/qa/test.jsonl --video-dir data/videos --limit 1 --frames 4"

test_commands:
  - "python -m unittest discover -s tests -v"

notes: "CPU smoke test using SmolVLM2-500M-Video-Instruct. Requires the dataset QA manifest and referenced MP4 files under data/videos. The sample videos total about 11.2 GB; the full video collection is not included in the repository. Inference may take multiple minutes per question on CPU. One-question accuracy is not a reliable benchmark estimate."
