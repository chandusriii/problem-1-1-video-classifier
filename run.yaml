setup_commands:
  - "python -m pip install -r requirements.txt"

run_commands:
  - "python src/main.py --help"
  - "python -m unittest discover -s tests -v"
  - "python src/prepare_dataset.py --limit 1"
  - "python src/infer.py --qa data/qa/test.jsonl --video-dir data/videos --limit 1 --frames 4"

test_commands: []

notes: "Runs a reproducibility smoke test using only the first question. Downloads the QA manifest and only the referenced MP4, not the full ~11.2 GB collection. SmolVLM2 model weights download on first use. CPU runtime is around two minutes per question on the development machine; one question is not a benchmark accuracy estimate."
