setup_commands:
  - "python -m pip install -r requirements.txt"

run_commands:
  - "python src/main.py --help"
  - "python -m unittest discover -s tests -v"
  - "python src/prepare_dataset.py --limit 1"
  - "python src/infer.py --qa data/qa/test.jsonl --video-dir data/videos --limit 1 --frames 4"

test_commands: []

notes: "Quality-first smoke test. Dataset preparation downloads the QA manifest and only the video for the first question, not the full ~11.2 GB video collection. SmolVLM2-500M-Video-Instruct weights download from Hugging Face on first use. The observed local smoke test took about 126 seconds including model loading. This is not a full benchmark accuracy result."
