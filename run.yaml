setup_commands:
  - "python -m pip install -r requirements.txt"

run_commands:
  - "python src/main.py --help"
  - "python -m unittest discover -s tests -v"
  - "python src/prepare_dataset.py --limit 1"
  - "python src/infer.py --qa data/qa/test.jsonl --video-dir data/videos --limit 1 --frames 4"

test_commands: []

notes: "Quality-first smoke test. Dataset preparation downloads the QA manifest and only the video for the first question; the full ~11.2 GB collection is not downloaded. Model weights download on first use. Local inference took approximately 126 seconds including model loading. This is a smoke test, not a full benchmark."
