setup_commands:
  - "python -m pip install -r requirements.txt"

run_commands:
  - "python src/main.py --help"
  - "python -m unittest discover -s tests -v"
  - "python src/prepare_dataset.py --limit 1"
  - "python src/infer.py --qa data/qa/test.jsonl --video-dir data/videos --limit 1 --frames 4"

test_commands: []

notes: "Smoke test: prepares only the first question's video, then runs one inference. Model weights download on first use. On the development CPU the original single-question run took about 126 seconds including load. Not a full benchmark."
