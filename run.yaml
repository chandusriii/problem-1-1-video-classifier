setup_commands:
  - "python -m pip install -r requirements.txt"

run_commands:
  - "python src/main.py --help"
  - "python -m unittest discover -s tests -v"
  - "python src/infer.py --limit 1 --frames 4"

test_commands:
  - "python -m unittest discover -s tests -v"

notes: "The inference command downloads SmolVLM2-500M-Video-Instruct on first run and requires the QA metadata and associated MP4 under data/qa/test.jsonl and data/videos. The 4-frame, one-question command is a smoke test and may take over 2 minutes on CPU. Do not infer full benchmark accuracy from it."
